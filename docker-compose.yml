services:
  channels:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/nestorzamili/channels:${IMAGE_TAG:?Set IMAGE_TAG to the 7-character commit SHA}
    container_name: channels
    restart: on-failure
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ADAPTER_STATE_DIR: /app/.zaileys/state
    volumes:
      - channels_session:/app/.zaileys
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  channels_session:
