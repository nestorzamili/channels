name: Deploy Channels

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: channels-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    uses: nestorzamili/gha-workflows/.github/workflows/deploy-container.yml@v1.5.2
    with:
      image-name: channels
      container-name: channels
      volume: channels_session:/app/.zaileys
      health-cmd: "kill -0 1 || exit 1"
      docker-context-name: channels-vm
      environment: production
    secrets: inherit
